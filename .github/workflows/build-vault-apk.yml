name: Build Vault APK

# Builds the SMS Vault Watcher debug APK on GitHub's runners (which can reach
# Google's Android SDK + Maven servers) and publishes it as a downloadable
# artifact. Trigger manually from the Actions tab, or it runs on pushes that
# touch the app.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/sms-vault-watcher-spec-todloq
    paths:
      - 'sms-vault-watcher/**'
      - '.github/workflows/build-vault-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          # Use the runner's preinstalled Android SDK directly. The
          # android-actions/setup-android action was removed because its v3 tries
          # to install the legacy 'tools' package, which Google has retired
          # (sdkmanager now errors with "Failed to find package 'tools'").
          SDKMGR="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          echo "Using sdkmanager at: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Optional: if the repo has a signing keystore secret, decode it and expose
      # it to Gradle so builds share one signature (installs without uninstalling).
      # No key is stored in the repo; without the secret the default debug key is used.
      - name: Configure signing (optional)
        env:
          VAULT_KEYSTORE_B64: ${{ secrets.VAULT_KEYSTORE_B64 }}
          VAULT_KEYSTORE_PASSWORD: ${{ secrets.VAULT_KEYSTORE_PASSWORD }}
          VAULT_KEY_ALIAS: ${{ secrets.VAULT_KEY_ALIAS }}
          VAULT_KEY_PASSWORD: ${{ secrets.VAULT_KEY_PASSWORD }}
        run: |
          if [ -n "$VAULT_KEYSTORE_B64" ]; then
            echo "$VAULT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vault.jks"
            {
              echo "VAULT_KEYSTORE_FILE=$RUNNER_TEMP/vault.jks"
              echo "VAULT_KEYSTORE_PASSWORD=$VAULT_KEYSTORE_PASSWORD"
              echo "VAULT_KEY_ALIAS=${VAULT_KEY_ALIAS:-vault}"
              echo "VAULT_KEY_PASSWORD=${VAULT_KEY_PASSWORD:-$VAULT_KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Signing with shared keystore from secret."
          else
            echo "No VAULT_KEYSTORE_B64 secret set; using the default debug key."
          fi

      - name: Build debug APK
        working-directory: sms-vault-watcher
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vault-debug-apk
          path: sms-vault-watcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publish the built APK onto an orphan dist branch so it can be pulled
      # over plain git (artifact blob storage is not always reachable).
      - name: Publish APK to dist branch
        if: success()
        run: |
          set -e
          APK="$(find sms-vault-watcher/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/app-debug.apk"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan vault-apk-dist
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/app-debug.apk" ./app-debug.apk
          git add app-debug.apk
          git commit -m "Vault debug APK from ${GITHUB_SHA::7}"
          git push -f origin vault-apk-dist
