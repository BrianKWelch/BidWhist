name: Build Vault APK

# Builds the SMS Vault Watcher debug APK on GitHub's runners (which can reach
# Google's Android SDK + Maven servers) and publishes it as a downloadable
# artifact. Trigger manually from the Actions tab, or it runs on pushes that
# touch the app.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/sms-vault-watcher-spec-todloq
    paths:
      - 'sms-vault-watcher/**'
      - '.github/workflows/build-vault-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          # Use the runner's preinstalled Android SDK directly. The
          # android-actions/setup-android action was removed because its v3 tries
          # to install the legacy 'tools' package, which Google has retired
          # (sdkmanager now errors with "Failed to find package 'tools'").
          SDKMGR="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          echo "Using sdkmanager at: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Self-bootstrapping shared signing key. The whole point of a stable
      # signature here is that each build installs over the previous one (no
      # uninstall); it is NOT a secret (the vault is protected by biometrics +
      # SQLCipher, not by the APK signature). So the build manages the key itself:
      #   1. Reuse the shared keystore from the orphan `vault-signing` branch.
      #   2. If it doesn't exist yet, generate one and publish it there.
      # After the first signed build, every later build reuses the same key with
      # zero manual steps. A pasted VAULT_KEYSTORE_B64 secret, if present, still
      # wins as an override.
      - name: Configure signing
        env:
          VAULT_KEYSTORE_B64: ${{ secrets.VAULT_KEYSTORE_B64 }}
          VAULT_KEYSTORE_PASSWORD: ${{ secrets.VAULT_KEYSTORE_PASSWORD }}
          VAULT_KEY_ALIAS: ${{ secrets.VAULT_KEY_ALIAS }}
          VAULT_KEY_PASSWORD: ${{ secrets.VAULT_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          KS="$RUNNER_TEMP/vault.jks"
          if [ -n "$VAULT_KEYSTORE_B64" ]; then
            echo "$VAULT_KEYSTORE_B64" | base64 -d > "$KS"
            STOREPASS="$VAULT_KEYSTORE_PASSWORD"
            ALIAS="${VAULT_KEY_ALIAS:-vault}"
            KEYPASS="${VAULT_KEY_PASSWORD:-$VAULT_KEYSTORE_PASSWORD}"
            echo "Signing with shared keystore from secret (override)."
          else
            STOREPASS="vaultshared"
            ALIAS="vault"
            KEYPASS="vaultshared"
            # Reuse the shared keystore from the signing branch if it exists.
            if git fetch --quiet origin vault-signing 2>/dev/null; then
              git show origin/vault-signing:vault.jks > "$KS" 2>/dev/null || true
            fi
            if [ ! -s "$KS" ]; then
              echo "No shared keystore yet; generating one and publishing it to vault-signing."
              keytool -genkeypair -v -keystore "$KS" \
                -storepass "$STOREPASS" -keypass "$KEYPASS" \
                -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Vault, OU=Vault, O=Vault, L=NA, ST=NA, C=US"
              TMP="$(mktemp -d)"
              cp "$KS" "$TMP/vault.jks"
              (
                cd "$TMP"
                git init -q
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git checkout -q --orphan vault-signing
                git add vault.jks
                git commit -q -m "Shared signing keystore for vault APK"
                git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" vault-signing
              )
              echo "Published new shared keystore."
            else
              echo "Reusing shared keystore from vault-signing branch."
            fi
          fi
          {
            echo "VAULT_KEYSTORE_FILE=$KS"
            echo "VAULT_KEYSTORE_PASSWORD=$STOREPASS"
            echo "VAULT_KEY_ALIAS=$ALIAS"
            echo "VAULT_KEY_PASSWORD=$KEYPASS"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: sms-vault-watcher
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vault-debug-apk
          path: sms-vault-watcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publish the built APK onto an orphan dist branch so it can be pulled
      # over plain git (artifact blob storage is not always reachable).
      - name: Publish APK to dist branch
        if: success()
        run: |
          set -e
          APK="$(find sms-vault-watcher/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/app-debug.apk"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan vault-apk-dist
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/app-debug.apk" ./app-debug.apk
          git add app-debug.apk
          git commit -m "Vault debug APK from ${GITHUB_SHA::7}"
          git push -f origin vault-apk-dist
