name: Build Vault APK

# Builds the SMS Vault Watcher debug APK on GitHub's runners (which can reach
# Google's Android SDK + Maven servers) and publishes it as a downloadable
# artifact. Trigger manually from the Actions tab, or it runs on pushes that
# touch the app.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/sms-vault-watcher-spec-todloq
    paths:
      - 'sms-vault-watcher/**'
      - '.github/workflows/build-vault-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: sms-vault-watcher
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vault-debug-apk
          path: sms-vault-watcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
